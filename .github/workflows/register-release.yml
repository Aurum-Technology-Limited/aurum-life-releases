name: Register release in update manifest

# Wires the Tauri auto-updater. When a release is published in THIS public
# repo, read its `latest.json` (Tauri's updater manifest) for the per-platform
# minisign signature, RE-RESOLVE the download URL against this release's own
# published assets, and register each platform with the `release_manifest_v1`
# backend via the `register_release_version` RPC. `p_make_live: true` bumps the
# channel's latest_version so clients begin updating.
#
# Why here (the public repo) and not the private build repo: the updater needs
# PUBLIC, client-downloadable URLs. Those live here. The private repo's release
# assets aren't downloadable by end users.
#
# IMPORTANT: the `url` inside latest.json is NOT trusted. tauri-action bakes it
# with the BUILD repo's asset URL (the private aurum-life-desktop repo), which
# 404s for end users. So we register the URL of the matching asset ON THIS
# release instead (see the re-resolve step below). Trusting the embedded URL is
# exactly what shipped a manifest full of 404 links for v0.1.17 until it was
# hand-patched. The signature is still read from latest.json — it signs the file
# bytes, which are identical whichever repo hosts them.
#
# Required repo config (Settings → Secrets and variables → Actions):
#   - Variable  SUPABASE_URL                 e.g. https://sftppbnqlsumjlrgyzgo.supabase.co
#   - Secret    SUPABASE_SERVICE_ROLE_KEY    service-role key for the RPC (write path)
#
# Idempotent: re-publishing a release re-registers (RPC upserts on
# version+channel+platform). Also runnable manually for back-registering an
# existing tag (e.g. v0.1.10).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to register (e.g. v0.1.10)"
        required: true
      channel:
        description: "Channel to register into (stable or beta)"
        required: false
        default: stable

jobs:
  register:
    # Skip drafts/pre-releases on the auto path; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Register every platform from latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          # Auto (release:published) path always registers stable; manual
          # dispatch can target beta via the `channel` input (default stable).
          CHANNEL: ${{ inputs.channel || 'stable' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]]; then
            echo "::error::Set the SUPABASE_URL variable and SUPABASE_SERVICE_ROLE_KEY secret on this repo."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "Resolving release ${TAG}…"
          REL=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")

          LJ_URL=$(jq -r '.assets[] | select(.name == "latest.json") | .browser_download_url' <<<"${REL}" | head -1)
          if [[ -z "${LJ_URL}" || "${LJ_URL}" == "null" ]]; then
            echo "::error::No latest.json asset on ${TAG} — nothing to register."
            exit 1
          fi
          LATEST=$(curl -fsSL "${LJ_URL}")
          NOTES=$(jq -r '.notes // ""' <<<"${LATEST}")

          # One RPC call per platform key in latest.json. The keys are Tauri's
          # `{{target}}` values (e.g. windows-x86_64, darwin-aarch64) — exactly
          # what release_manifest_v1 matches on.
          PLATFORMS=$(jq -r '.platforms | keys[]' <<<"${LATEST}")
          if [[ -z "${PLATFORMS}" ]]; then
            echo "::error::latest.json has no platforms."
            exit 1
          fi
          while IFS= read -r PLATFORM; do
            EMBEDDED_URL=$(jq -r --arg p "${PLATFORM}" '.platforms[$p].url' <<<"${LATEST}")
            SIG=$(jq -r --arg p "${PLATFORM}" '.platforms[$p].signature' <<<"${LATEST}")

            # ── Re-resolve the download URL against THIS release's assets ──
            # The `url` baked into latest.json points at whatever repo *built*
            # the bundle — that's tauri-action in the PRIVATE build repo
            # (aurum-life-desktop), whose release assets 404 for end users.
            # This public repo is where the installers are actually published
            # and downloadable, so register the URL of the matching asset ON
            # THIS RELEASE instead of trusting latest.json's embedded URL.
            #
            # This is the fix for the class of bug where the manifest served a
            # build-repo URL and every client's auto-update 404'd. Match by the
            # asset filename (the tail of the embedded URL); the file contents
            # (hence the minisign SIG) are identical across repos, so the
            # signature is still taken from latest.json.
            ASSET_NAME=$(basename "${EMBEDDED_URL}")
            URL=$(jq -r --arg n "${ASSET_NAME}" \
              '.assets[] | select(.name == $n) | .browser_download_url' <<<"${REL}" | head -1)
            if [[ -z "${URL}" || "${URL}" == "null" ]]; then
              echo "::error::latest.json references asset '${ASSET_NAME}' (platform '${PLATFORM}'), but no such asset is attached to release ${TAG} in ${REPO}. The installer was not published to this repo — refusing to register a URL that would 404 for clients."
              exit 1
            fi
            echo "  registering ${PLATFORM} → ${URL}"
            curl -fsS -X POST \
              "${SUPABASE_URL}/rest/v1/rpc/register_release_version" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc \
                --arg v "${VERSION}" --arg c "${CHANNEL}" --arg p "${PLATFORM}" \
                --arg u "${URL}" --arg s "${SIG}" --arg n "${NOTES}" \
                '{p_version:$v, p_channel:$c, p_platform:$p, p_url:$u, p_signature:$s, p_notes:$n, p_make_live:true}')" \
              > /dev/null
          done <<< "${PLATFORMS}"

          echo "Registered ${VERSION} (${CHANNEL}) for: $(echo "${PLATFORMS}" | paste -sd', ' -)"
